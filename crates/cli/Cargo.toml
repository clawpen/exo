[package]
name = "containment"
version.workspace = true
edition.workspace = true

[[bin]]
name = "containment"
path = "src/main.rs"

[dependencies]
containment-runtime = { path = "../containment-runtime", features = ["registry"] }
containment-gpu = { path = "../containment-gpu" }
containment-image = { path = "../containment-image" }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
containment-wsl = { path = "../containment-wsl" }
