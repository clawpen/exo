[package]
name = "exo-image"
version.workspace = true
edition.workspace = true

[features]
default = ["registry"]
registry = ["reqwest", "async-compression", "futures-util"]

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha256 = "1.5"

# OCI image spec
oci-spec = "0.7"

# Archive handling
tar = "0.4"
flate2 = "1.0"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"], optional = true }

# HTTP client for pulling images
reqwest = { version = "0.12", features = ["stream", "json"], optional = true }

# SHA256 for digest verification
sha2 = "0.10"

# Hex encoding for digests
hex = "0.4"

# Base64 for auth
base64 = "0.22"

# URL encoding
url = "2.5"

# Directory detection
dirs = "5.0"

# Async utilities
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
