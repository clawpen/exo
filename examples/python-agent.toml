# OpenClaw container configuration for a Python AI agent

[container]
name = "python-agent"
image = "python:3.12-slim"

[container.resources]
memory = "2G"
cpu = "2"

[container.runtime]
workdir = "/app"
env = [
    "PYTHONPATH=/app",
    "PYTHONDONTWRITEBYTECODE=1",
    "PYTHONUNBUFFERED=1"
]

[container.network]
mode = "bridge"
port_mappings = [
    { host_port = 8080, container_port = 8000 }
]

[process]
command = ["python", "-m", "my_agent"]
user = "agent"
