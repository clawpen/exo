[workspace]
members = ["crates/containment-runtime", "crates/cli", "crates/containment-gpu", "crates/containment-image", "crates/containment-wsl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Containment Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/containment/container"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Linux namespaces & syscalls
nix = { version = "0.29", features = ["sched", "mount", "signal", "user", "fs", "process", "hostname"] }
libc = "0.2"

# GPU
nvml-wrapper = "0.10"

# Networking
socket2 = "0.5"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
