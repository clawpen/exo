[package]
name = "openclaw-runtime"
version = "0.1.0"
edition = "2021"

# Standalone package for deployment into WSL2
[workspace]

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Utilities
uuid = { version = "1.11", features = ["v4"] }

# Command line
clap = { version = "4.5", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Linux system calls (only available on Linux)
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["sched", "mount", "signal", "user", "fs", "process", "ptrace"] }
libc = "0.2"
procfs = "0.17"
