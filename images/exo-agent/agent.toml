# Exo Agent Configuration

name = "exo-agent"
system_prompt = "You are a helpful AI assistant."
max_tokens = 1024
temperature = 0.7
tools = ["read", "write", "exec", "web_fetch", "list"]
workdir = "/workspace"

[llm]
provider = "zai"
base_url = "https://api.z.ai/api/coding/paas/v4"
model = "glm-4.7-flash"

[memory]
enabled = true
db_path = "/data/memory.db"
max_turns = 50
max_context_tokens = 8192

[channel]
mode = "stdio"

[volumes]
