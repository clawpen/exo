name: CI

on:
  push:
    branches: [main, exo-enterprise]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, lint & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # fmt/clippy are informational until the legacy warnings are cleaned up
      # (tracked in ROADMAP_ENTERPRISE.md E7); build/test/security are hard gates.
      - name: Format check (informational)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # exo-image is warning-clean and held to that standard; the rest of the
      # workspace is informational until its legacy warnings are cleaned up.
      - name: Clippy exo-image (gate)
        run: cargo clippy -p exo-image --all-targets -- -D warnings

      - name: Clippy workspace (informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Build (gate)
        run: cargo build --workspace

      - name: Test (gate — image crate unit suite incl. security guards)
        run: cargo test -p exo-image --lib

  security:
    name: Supply-chain audit (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Known-vulnerability scan of the dependency tree (RUSTSEC advisories).
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # License / banned-crate / duplicate / source policy (see deny.toml).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  benchmark:
    name: Benchmark vs Docker (non-gating)
    runs-on: ubuntu-latest
    # Informational until the benchmark suite is proven stable on CI runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p exo

      - name: Run head-to-head benchmark
        run: ./scripts/bench-vs-docker.sh
        env:
          EXO_BIN: ${{ github.workspace }}/target/release/exo

      - name: Run density benchmark
        run: ./scripts/bench-density.sh
        env:
          EXO_BIN: ${{ github.workspace }}/target/release/exo
          MAX: 200

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: results/bench-*.json
          if-no-files-found: ignore
